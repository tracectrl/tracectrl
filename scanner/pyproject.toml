[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracectrl-scanner"
version = "0.1.0"
description = "Static security scanner for OpenClaw installations"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "CloudsineAI" }]
dependencies = [
    "pyjson5>=1.6",
    "networkx>=3.0",
    "pydantic>=2.0",
    "rich>=13.0",
]

[tool.hatch.build.targets.wheel]
sources = ["src"]
