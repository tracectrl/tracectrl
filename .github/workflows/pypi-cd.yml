name: Publish changed packages to PyPI

on:
  push:
    branches: [main]
    paths:
      - 'scanner/**'
      - 'sdk/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read

    # Matrix is limited to packages that have a PyPI Trusted Publisher
    # configured AND have been intentionally released. Adding a new package
    # requires (a) setting up the Trusted Publisher on pypi.org, and (b)
    # adding the matrix entry here. Until both are done the publish step
    # fails noisily on every push to main, so we keep the matrix tight.
    #
    # Held back (not in matrix yet, see also the case in publish.yml):
    #   tracectrl-mcp, tracectrl-instrumentation-crewai,
    #   tracectrl-instrumentation-langchain, tracectrl-instrumentation-google-adk
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tracectrl
            dir: sdk/tracectrl
          - name: tracectrl-scanner
            dir: scanner
          - name: tracectrl-instrumentation-strands
            dir: sdk/tracectrl-instrumentation-strands
          - name: tracectrl-instrumentation-agno
            dir: sdk/tracectrl-instrumentation-agno

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check if version is new
        id: check
        run: |
          VERSION=$(grep '^version' ${{ matrix.dir }}/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://pypi.org/pypi/${{ matrix.name }}/$VERSION/json)
          if [ "$STATUS" = "404" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.name }} $VERSION not on PyPI — will publish."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.name }} $VERSION already on PyPI — skipping."
          fi

      - name: Build ${{ matrix.name }}
        if: steps.check.outputs.publish == 'true'
        run: |
          pip install build
          python -m build ${{ matrix.dir }}

      - name: Publish ${{ matrix.name }} ${{ steps.check.outputs.version }}
        if: steps.check.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.dir }}/dist
