name: CI

on:
  push:
    branches: [dev, "sprint-*", "mvp3-*"]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./scanner
          pip install -e ./sdk/tracectrl
          pip install -r engine/requirements.txt
          pip install pytest ruff
          # Optional judge backend — required to actually run the Gemini
          # path of the guardrail judge tests. Without this they SKIP
          # (tests are written with pytest.importorskip) and the Gemini
          # path goes unverified.
          pip install google-genai

      - name: Lint
        run: ruff check sdk/ engine/ scanner/ tests/

      - name: Test
        run: pytest tests/ -v
