[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracectrl-instrumentation-google-adk"
version = "0.1.0"
description = "TraceCtrl Google ADK instrumentation"
requires-python = ">=3.10"
dependencies = [
    "tracectrl>=0.1.0",
    "openinference-instrumentation-google-adk>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tracectrl"]
