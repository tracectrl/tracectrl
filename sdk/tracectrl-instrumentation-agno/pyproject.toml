[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracectrl-instrumentation-agno"
version = "0.1.0"
description = "TraceCtrl Agno instrumentation"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "tracectrl>=0.1.0",
    "openinference-instrumentation-agno>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tracectrl"]
